# 可以编写生产环境的配置，会覆盖application.yml 配置
spring:
  application:
    name: ai-agent
  ai:
    dashscope:
      api-key: ${My_API_Key}
      chat:
        options:
          model: qwen-plus
  datasource:
    url: jdbc:postgresql://pgm-7xv7tb3483628ekcro.rwlb.cn-guangzhou.rds.aliyuncs.com:5432/ai_agent
    username: ${PG_USERNAME}
    password: ${PG_PASSWORD}
    driver-class-name: org.postgresql.Driver
#    vectorstore:
#      pgvector:
#        index-type: HNSW
#        distance-type: COSINE_DISTANCE
#        max-document-batch-size: 10000 # Optional: Maximum number of documents per batch
#    mcp:
#      client:
#        sse:
#          connections:
#            server1:
#              url: http://localhost:8127
#        stdio:
#          servers-configuration: classpath:mcp-servers.json

server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi 接口文档配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.josee.aiagent.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn

# searchApi
search-api:
  api-key: ${Search_API_Key}
